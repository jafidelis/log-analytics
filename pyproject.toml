[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analytics"
version = "0.1.0"
description = "Pipeline experimental para análise de anomalias em logs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "drain3==0.9.11",
    "scikit-learn==1.9.1",
    "sentence-transformers==5.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
notebook = [
    "jupyterlab>=4,<5",
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"